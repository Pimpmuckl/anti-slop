# Temporary recovery job: produces a proposed Git tree, never moves a branch.
# Removed after the recovered source and distribution have been verified.
name: Recover native source
on:
  push:
    branches: [feat/python-rust-anti-slop]
    paths: [.github/workflows/recover-native.yml]
permissions:
  contents: write
jobs:
  recover:
    if: github.repository == 'Pimpmuckl/anti-slop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - run: python -m pip install ruff==0.16.6 mypy==2.3.1
      - name: Apply reviewed recovery fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          def replace(path, old, new):
              p = Path(path)
              source = p.read_text()
              assert source.count(old) == 1, (path, old)
              p.write_text(source.replace(old, new))
          replace('python/anti_slop.py', 'path = Path(argument).absolute()', 'path = Path(argument).resolve()')
          replace('python/anti_slop.py', 'return {}, Path.cwd()', 'return {}, Path.cwd().resolve()')
          replace('python/anti_slop.py', 'self.locations: dict[ast.stmt, tuple[int, int]]', 'self.locations: dict[ast.AST, tuple[int, int]]')
          replace('rust/tests/compiler.rs', 'let value = 42;', 'let value = 42_u32;')
          PY
          ruff format python
          cargo fmt --manifest-path rust/Cargo.toml
          node scripts/sync-native-assets.mjs
      - name: Validate Python
        id: python
        continue-on-error: true
        run: |
          python -m unittest discover -s python/tests -v
          python python/anti_slop.py python/anti_slop.py python/tests
          ruff check python
          mypy --config-file python/mypy.ini python/anti_slop.py
      - name: Validate Rust and distribution
        id: rust
        continue-on-error: true
        run: |
          cargo test --manifest-path rust/Cargo.toml --locked
          cargo run --manifest-path rust/Cargo.toml -- --manifest-path rust/Cargo.toml --locked
          node scripts/sync-native-assets.mjs --check
          node --test scripts/install-native.test.mjs
      - name: Store proposed source tree without updating refs
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const cp = require('node:child_process');
            const paths = cp.execFileSync('git', ['ls-files', '-m', '-o', '--exclude-standard', '-z']).toString().split('\0').filter(Boolean);
            const allowed = ['python/', 'rust/', 'skills/install-anti-slop/assets/anti-slop-python/', 'skills/install-anti-slop/assets/anti-slop-rust/'];
            const tree = [];
            for (const path of paths) {
              if (!allowed.some(prefix => path.startsWith(prefix))) throw new Error(`Unexpected changed path: ${path}`);
              const content = fs.readFileSync(path, 'utf8');
              const {data} = await github.rest.git.createBlob({...context.repo, content, encoding: 'utf-8'});
              tree.push({path, mode: '100644', type: 'blob', sha: data.sha});
            }
            const base = cp.execFileSync('git', ['rev-parse', 'HEAD^{tree}']).toString().trim();
            const {data} = await github.rest.git.createTree({...context.repo, base_tree: base, tree});
            core.info(`PROPOSED_TREE=${data.sha}`);
            core.info(`PARENT_COMMIT=${context.sha}`);
            core.info(`CHANGED_FILES=${JSON.stringify(paths)}`);

# Temporary, branch-only execution environment. Creates Git objects, never moves refs.
# Removed from the final PR tree after verified source/formatter output is committed.
name: Validate native regressions
on:
  push:
    branches: [feat/python-rust-anti-slop]
    paths: [.github/workflows/recover-native.yml]
permissions:
  contents: write
jobs:
  recover:
    if: github.repository == 'Pimpmuckl/anti-slop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: python -m pip install ruff==0.16.6 mypy==2.3.1
      - name: Confirm new regressions fail before the fix
        run: |
          python - <<'PY'
          import subprocess, sys
          result = subprocess.run([sys.executable, '-m', 'unittest', 'discover', '-s', 'python/tests', '-p', 'test_regressions.py', '-v'])
          if result.returncode == 0:
              raise SystemExit('Expected the reported regressions to reproduce before patching')
          PY
      - name: Apply narrowly scoped source fixes and format
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('python/anti_slop.py')
          source = p.read_text()
          changes = [
              ('self.lines = source.splitlines()', 'self.lines = source.split("\\n")'),
              ('self.scope = self.make_scope(node, old, node.body)', 'parent = old.parent if isinstance(old.node, ast.ClassDef) else old\n        self.scope = self.make_scope(node, parent, node.body)'),
              ('    try:\n        tree = ast.parse(source, filename=path)', '    source = source.replace("\\r\\n", "\\n").replace("\\r", "\\n")\n    try:\n        tree = ast.parse(source, filename=path)'),
          ]
          for old, new in changes:
              assert source.count(old) == 1, old
              source = source.replace(old, new)
          p.write_text(source)
          PY
          ruff format python
          node scripts/sync-native-assets.mjs
      - name: Validate fixed source and shipped copy
        run: |
          python -m unittest discover -s python/tests -v
          python python/anti_slop.py python/anti_slop.py python/tests
          ruff check python
          mypy --config-file python/mypy.ini python/anti_slop.py
          node scripts/sync-native-assets.mjs --check
          node --test scripts/install-native.test.mjs
      - name: Store verified proposed tree without updating refs
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const cp = require('node:child_process');
            const paths = cp.execFileSync('git', ['ls-files', '-m', '-o', '--exclude-standard', '-z']).toString().split('\0').filter(Boolean);
            const allowed = ['python/', 'skills/install-anti-slop/assets/anti-slop-python/'];
            const tree = [];
            for (const path of paths) {
              if (!allowed.some(prefix => path.startsWith(prefix))) throw new Error(`Unexpected changed path: ${path}`);
              const {data} = await github.rest.git.createBlob({...context.repo, content: fs.readFileSync(path, 'utf8'), encoding: 'utf-8'});
              tree.push({path, mode: '100644', type: 'blob', sha: data.sha});
            }
            const base = cp.execFileSync('git', ['rev-parse', 'HEAD^{tree}']).toString().trim();
            const {data} = await github.rest.git.createTree({...context.repo, base_tree: base, tree});
            core.info(`PROPOSED_TREE=${data.sha}`);
            core.info(`PARENT_COMMIT=${context.sha}`);
            core.info(`CHANGED_FILES=${JSON.stringify(paths)}`);

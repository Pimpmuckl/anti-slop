name: Native anti-slop

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.11'}
          - {os: ubuntu-latest, python: '3.13'}
          - {os: ubuntu-latest, python: '3.14'}
          - {os: windows-latest, python: '3.13'}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s python/tests -v
      - run: python python/anti_slop.py python/anti_slop.py python/tests

  rust:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, toolchain: '1.85.0'}
          - {os: ubuntu-latest, toolchain: stable}
          - {os: windows-latest, toolchain: stable}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy,rustfmt
      - run: cargo test --manifest-path rust/Cargo.toml --locked
      - run: cargo run --manifest-path rust/Cargo.toml --locked -- --manifest-path rust/Cargo.toml --locked

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: python -m pip install ruff==0.16.6 mypy==2.3.1
      - name: Check lint and type policy
        run: |
          ruff check python
          mypy --config-file python/mypy.ini python/anti_slop.py
      - name: Check distribution and installer
        if: always()
        run: |
          node scripts/sync-native-assets.mjs --check
          node --test scripts/install-native.test.mjs
      - name: Check canonical formatting and generated copies
        if: always()
        run: |
          ruff format python
          cargo fmt --manifest-path rust/Cargo.toml
          node scripts/sync-native-assets.mjs
          git diff --binary > native-formatting.patch
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: native-formatting
          path: native-formatting.patch
          if-no-files-found: ignore

  installer:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/sync-native-assets.mjs --check
      - run: node --test scripts/install-native.test.mjs
